name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  verify:
    name: Verify Release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Format
        run: cargo fmt --all -- --check

      - name: Lint
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Test
        run: cargo test --workspace

      - name: Lexer corpus smoke
        run: cargo run -p tsvm-lexer --bin lexer_corpus_runner -- tests/fixtures/lexer

      - name: Demo smoke
        run: cargo run -p tsvm-demo

  build:
    name: Build ${{ matrix.name }}
    needs: verify
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x64
            os: ubuntu-latest
            archive: tsvm-linux-x64
          - name: macos-arm64
            os: macos-latest
            archive: tsvm-macos-arm64
          - name: windows-x64
            os: windows-latest
            archive: tsvm-windows-x64

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build release executables
        run: cargo build --release -p tsvm-demo -p tsvm-benchmarks

      - name: Package Unix executables
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "dist/${{ matrix.archive }}"
          cp target/release/tsvm-demo "dist/${{ matrix.archive }}/"
          cp target/release/tsvm-benchmarks "dist/${{ matrix.archive }}/"
          cp README.md LICENSE "dist/${{ matrix.archive }}/"
          tar -C dist -czf "dist/${{ matrix.archive }}-${GITHUB_REF_NAME}.tar.gz" "${{ matrix.archive }}"

      - name: Package Windows executables
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force "dist/${{ matrix.archive }}" | Out-Null
          Copy-Item target/release/tsvm-demo.exe "dist/${{ matrix.archive }}/"
          Copy-Item target/release/tsvm-benchmarks.exe "dist/${{ matrix.archive }}/"
          Copy-Item README.md, LICENSE "dist/${{ matrix.archive }}/"
          Compress-Archive -Path "dist/${{ matrix.archive }}" -DestinationPath "dist/${{ matrix.archive }}-$env:GITHUB_REF_NAME.zip"

      - name: Upload release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive }}
          path: |
            dist/*.tar.gz
            dist/*.zip
          if-no-files-found: error

  publish:
    name: Publish GitHub Release
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Write release notes
        shell: bash
        run: |
          cat > RELEASE_NOTES.md <<'NOTES'
          # TSVM first preview

          This is the first TSVM preview release. It includes command-line
          executables for:

          - `tsvm-demo`: end-to-end proof that TypeScript executes through the
            TSVM pipeline with no generated JavaScript.
          - `tsvm-benchmarks`: interpreter benchmark snapshot runner.

          The runtime is a standalone implementation/model through M13. Real
          Chromium/Blink/V8 embedding remains future work.
          NOTES

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "TSVM $GITHUB_REF_NAME" \
            --notes-file RELEASE_NOTES.md
